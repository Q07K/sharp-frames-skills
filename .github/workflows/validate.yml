name: Validate skill package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/check_repository.py
      - run: python -m compileall -q tools evals/fixtures
      - run: git diff --check
      - name: Install frozen API evaluation dependencies
        run: python -m pip install --disable-pip-version-check -r evals/fastapi/requirements.txt
      - name: Reproduce saved API evaluation results
        run: python -X utf8 evals/fastapi/replay_evidence.py
